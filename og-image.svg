<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="EnvGate — CI-friendly env checker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0a101b"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity=".8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="80" r="220" fill="#38bdf8" opacity=".08"/>
  <circle cx="80" cy="560" r="240" fill="#5eead4" opacity=".07"/>

  <text x="80" y="160" fill="#5eead4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="3">CLI · MIT SOURCE INCLUDED</text>
  <text x="80" y="250" fill="#e8eefc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="96" font-weight="750">EnvGate</text>
  <text x="80" y="320" fill="#9aadc9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32">CI-friendly env checker — values stay redacted</text>

  <rect x="80" y="380" width="160" height="48" rx="24" fill="#122038" stroke="#2a3a55"/>
  <text x="160" y="411" text-anchor="middle" fill="#e8eefc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">$19 one-time</text>
  <rect x="256" y="380" width="130" height="48" rx="24" fill="#122038" stroke="#2a3a55"/>
  <text x="321" y="411" text-anchor="middle" fill="#9aadc9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">Node 18+</text>
  <rect x="402" y="380" width="150" height="48" rx="24" fill="#122038" stroke="#2a3a55"/>
  <text x="477" y="411" text-anchor="middle" fill="#4ade80" font-family="ui-monospace, monospace" font-size="20">zero deps</text>

  <!-- gate graphic -->
  <rect x="820" y="170" width="260" height="300" rx="32" fill="#0b1526" stroke="url(#g1)" stroke-width="4"/>
  <rect x="860" y="220" width="180" height="44" rx="12" fill="#122038" stroke="#2a3a55"/>
  <text x="950" y="248" text-anchor="middle" fill="#9aadc9" font-family="ui-monospace, monospace" font-size="18">.env.example</text>
  <rect x="860" y="280" width="180" height="44" rx="12" fill="#122038" stroke="#2a3a55"/>
  <text x="950" y="308" text-anchor="middle" fill="#9aadc9" font-family="ui-monospace, monospace" font-size="18">.env</text>
  <path d="M950 338 v36" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
  <rect x="890" y="380" width="120" height="36" rx="18" fill="url(#g1)"/>
  <text x="950" y="404" text-anchor="middle" fill="#042f2e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">PASS / FAIL</text>

  <text x="80" y="560" fill="#9aadc9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24">Missing keys · placeholders · secret shapes</text>
</svg>
